<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflection Agent Pattern — Live Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <a href="/" class="brand">
          <div class="brand__mark">R2</div>
          <div class="brand__text">
            <p class="brand__eyebrow">Curriculum Agent Patterns · 2/5</p>
            <p class="brand__title">Reflection</p>
          </div>
        </a>
        <div class="header-actions">
          <span class="status-badge">Deterministic demo</span>
          <a href="https://github.com/vpeetla-ai/reflection-agent-pattern" class="btn-ghost" style="padding:0.4rem 0.75rem;font-size:0.8rem;text-decoration:none">GitHub</a>
        </div>
      </div>
    </header>
    <main class="shell app-main">
      <div class="page-hero">
        <p class="eyebrow">Draft → critique → improve</p>
        <h1>Reflection Agent Pattern</h1>
        <p class="lede">Quality gates before shipping — watch draft, critic review, revision, and pass/fail.</p>
      </div>
      <section class="panel">
        <h2>Run demo</h2>
        <div class="inline-actions"><button id="run" type="button">Run reflection demo</button></div>
        <div id="answer" class="answer"></div>
        <div id="trace" class="trace-events"></div>
      </section>
    </main>
    <footer class="app-footer">Reflection pattern · <a href="https://github.com/vpeetla-ai/reflection-agent-pattern">vpeetla-ai</a></footer>
    <script>
      const DEMO = {
        answer: "Agents audit traces before they ship artifacts.",
        events: [
          { name: "draft.created", payload: { text: "Agents ship fast without review." } },
          { name: "critic.review", payload: { score: 62, findings: ["Missing governance hook", "No citation trace"] } },
          { name: "draft.revised", payload: { text: "Agents audit traces before they ship artifacts." } },
          { name: "quality.gate", payload: { score: 91, decision: "pass" } },
        ],
      };
      const trace = document.getElementById("trace");
      document.getElementById("run").onclick = async () => {
        trace.innerHTML = "";
        document.getElementById("answer").textContent = "";
        for (const e of DEMO.events) {
          const el = document.createElement("div");
          el.className = "event live";
          el.innerHTML = `<strong>${e.name}</strong><pre>${JSON.stringify(e.payload, null, 2)}</pre>`;
          trace.appendChild(el);
          await new Promise((r) => setTimeout(r, 700));
          el.classList.remove("live");
          el.classList.add("done");
        }
        document.getElementById("answer").textContent = DEMO.answer;
      };
    </script>
  </body>
</html>
