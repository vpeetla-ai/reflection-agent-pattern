name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: reflection-agent-pattern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m compileall -q src scripts

  test:
    name: Test (incl. reflection-delta benchmark + golden eval gate)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pip install -e golden-eval-registry
      - name: Run benchmark (regenerates docs/receipts/benchmark.md deterministically)
        run: python scripts/benchmark_reflection_delta.py
      - name: pytest (unit tests, benchmark invariants, golden eval gate)
        env:
          GOLDEN_EVAL_REGISTRY_PATH: ${{ github.workspace }}/golden-eval-registry
        run: pytest -q

  ci-ok:
    name: CI gate
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
